<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>images et figures</title>
    </head>
    <body>
        <h1>images et figures</h1>
        <p>Une image permet d'afficher un contenu visuel dans une page HTML</p>
        <img src="téléchargement (18).jpg" alt="a horse picture" width="120" height="120">
        <figure>
             <img src="Cat.jpg" alt="a cat using computer" >
             <figcaption>Un chat utilisant un ordinateur</figcaption>
            </figure>
    </body>
</html>
